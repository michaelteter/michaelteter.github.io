  <style>
    /* ==========================================================================
       Delicate Minimalist M6 Haiku Showcase - Scrubbed Single View
       ========================================================================== */

    @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600&display=swap');

    :root {
      --bg-dark: #0b0f19;
      --bg-gradient: radial-gradient(circle at 50% 40%, #1e1b4b 0%, #0f172a 60%, #0b0f19 100%);
      --text-main: #f1f5f9;
      --text-subtle: #475569;
      --accent-soft: #a78bfa;
      
      --font-family: 'Quicksand', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      text-transform: lowercase; /* Force everything lowercase */
    }

    body {
      font-family: var(--font-family);
      font-weight: 300;
      background-color: var(--bg-dark);
      background-image: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 32px 24px;
    }

    /* Minimal Container */
    .haiku-container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 52px;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .haiku-container.fade-out {
      opacity: 0;
      transform: translateY(8px);
    }

    .haiku-container.fade-in {
      animation: fadeIn 0.5s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 1. Center Title: [title] */
    .haiku-title {
      font-size: 2.2rem;
      font-weight: 400;
      color: var(--accent-soft);
      letter-spacing: 1px;
    }

    /* 2. Single Plain Haiku Text (3 Lines) */
    .haiku-lines {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .poem-line {
      font-size: 2.2rem;
      font-weight: 300;
      line-height: 1.5;
      color: var(--text-main);
      letter-spacing: 0.5px;
    }

    /* Subtle Bottom Progress Line */
    .bottom-progress {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.04);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #a78bfa, #f472b6, #38bdf8);
      transition: width 0.1s linear;
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .haiku-container {
        gap: 36px;
      }
      
      .haiku-title {
        font-size: 1.7rem;
      }
      
      .poem-line {
        font-size: 1.65rem;
        line-height: 1.4;
      }
    }

    /* Top Unobtrusive Attribution Line */
    .top-attribution {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.85rem;
      font-weight: 400;
      letter-spacing: 2px;
      color: #94a3b8;
      opacity: 0.85;
      text-transform: lowercase;
      pointer-events: none;
      white-space: nowrap;
    }

    /* Bottom Unobtrusive Copyright Line */
    .bottom-copyright {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.78rem;
      font-weight: 300;
      letter-spacing: 1.5px;
      color: #94a3b8;
      opacity: 0.85;
      text-transform: lowercase;
      text-align: center;
      white-space: nowrap;
      z-index: 2;
    }

    .bottom-copyright a {
      color: #cbd5e1;
      text-decoration: underline;
    }
  </style>
</head>

    /* ==========================================================================
       TEMPORARY AI EXCLUSION LIST (Prefiltering suspected AI haikus)
       Update this list after verifying with students.
       ========================================================================== */
    const SUSPECTED_AI_EXCLUSIONS = [
      "soft drops touch the grass",
      "soft paws walk so light",
      "rain falls from the sky",
      "silent snowflakes fall",
      "soft rain taps the glass",
      "golden sun appears",
      "morning rain falls",
      "soft rain falls softly",
      "fireflies wake now",
      "gentle winter breeze",
      "cherry blossoms falls",
      "sunlight warms the shelves",
      "soft rain falls outside",
      "rain falls on the glass",
      "warm cup in my hands.",
      "people gather here,",
      "orange whiskers gleam",
      "soft fur, sleepy eyes"
    ];

    const DISPLAY_HAIKUS = EMBEDDED_HAIKUS.filter(item => {
      const line1 = item.standard && item.standard.line1 ? item.standard.line1.toLowerCase().trim() : "";
      return !SUSPECTED_AI_EXCLUSIONS.includes(line1);
    });

    let currentIndex = 0;
    let isPlaying = true;
    let startTime = 0;
    let elapsedTime = 0;
    let timerInterval = null;

    function renderHaiku(index) {
      if (!DISPLAY_HAIKUS || !DISPLAY_HAIKUS.length) return;
      
      const container = document.getElementById('haikuContainer');
      container.classList.add('fade-out');
      
      setTimeout(() => {
        const item = DISPLAY_HAIKUS[index];
        
        document.getElementById('haikuTitle').textContent = (item.topic || 'untitled').toLowerCase();
        document.getElementById('line1').textContent = item.standard.line1.toLowerCase();
        document.getElementById('line2').textContent = item.standard.line2.toLowerCase();
        document.getElementById('line3').textContent = item.standard.line3.toLowerCase();

        container.classList.remove('fade-out');
        container.classList.add('fade-in');
        setTimeout(() => container.classList.remove('fade-in'), 500);
      }, 250);
    }

    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      startTime = Date.now() - elapsedTime;
      
      timerInterval = setInterval(() => {
        if (!isPlaying) return;
        elapsedTime = Date.now() - startTime;
        let progress = (elapsedTime / DISPLAY_DURATION_MS) * 100;
        
        if (progress >= 100) {
          progress = 100;
          nextHaiku();
        }
        document.getElementById('progressFill').style.width = `${progress}%`;
      }, 100);
    }

    function resetTimer() {
      elapsedTime = 0;
      startTime = Date.now();
      document.getElementById('progressFill').style.width = '0%';
      if (isPlaying) startTimer();
    }

    function nextHaiku() {
      if (!DISPLAY_HAIKUS.length) return;
      currentIndex = (currentIndex + 1) % DISPLAY_HAIKUS.length;
      renderHaiku(currentIndex);
      resetTimer();
    }

    function prevHaiku() {
      if (!DISPLAY_HAIKUS.length) return;
      currentIndex = (currentIndex - 1 + DISPLAY_HAIKUS.length) % DISPLAY_HAIKUS.length;
      renderHaiku(currentIndex);
      resetTimer();
    }

    /* Keyboard navigation shortcuts (Arrow keys & Spacebar skip) */
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.code === 'Space') {
        e.preventDefault();
        nextHaiku();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevHaiku();
      }
    });

    /* Randomize order across whole set */
    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      shuffleArray(DISPLAY_HAIKUS);
      renderHaiku(0);
      startTimer();
    });
